spring.application.name=Open-Credit-Platform

# --- Local PostgreSQL -------------------------------------------------------
# Override with DB_URL / DB_USER / DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/open_credit}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# --- JPA --------------------------------------------------------------------
# Liquibase owns the schema; Hibernate only verifies the entity mapping matches
# it, so a drift fails at boot instead of silently at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Liquibase --------------------------------------------------------------
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Jackson ------------------------------------------------------------------
# Jackson 3 (tools.jackson, the engine Boot 4 defaults to) already writes java.time
# types as ISO-8601 rather than epoch timestamps, so no override is needed for that.
spring.jackson.default-property-inclusion=non_null

# --- Security / JWT -----------------------------------------------------------
# Dev-only default secret (HS256 needs >= 256 bits); override with JWT_SECRET in any real
# deployment. Login is served by demo-seeded AppUser rows (036-seed-demo-users.sql) — there is
# no self-registration flow yet.
security.jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-min-32-bytes}
security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}
# JwtAuthenticationFilter sets Authentication directly from the token; Spring's default
# AuthenticationManager/UserDetailsService (and its "generated security password" boot warning)
# is never on that path, so it's excluded rather than left as misleading noise.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- Actuator -------------------------------------------------------------------
# Only health/info are exposed; everything else (env, beans, ...) would leak DB_URL/JWT secret
# material and is left off rather than exposed-then-locked-down.
management.endpoints.web.exposure.include=health,info

# --- Logging ----------------------------------------------------------------
# requestId/correlationId are populated per request by RequestContextFilter via MDC.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId:-none},%X{correlationId:-none}] %logger{36} - %msg%n
