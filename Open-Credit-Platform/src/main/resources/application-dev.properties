# Local development / demo only. Activate with SPRING_PROFILES_ACTIVE=dev.

security.jwt.secret=${JWT_SECRET:dev-only-secret-key-do-not-use-in-production-min-32-bytes}

# Keeps the demo logins seeded by 036-seed-demo-users.sql active: 043 (context !demo) deactivates
# them in every run that does not select the demo context.
spring.liquibase.contexts=demo
