services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: open_credit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # No new profile: application.properties already reads DB_URL/DB_USER/DB_PASSWORD via
    # ${ENV_VAR:default}, so docker-compose only needs to override those three.
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/open_credit
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
