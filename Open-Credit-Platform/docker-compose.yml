services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: open_credit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # Local demo stack: the dev profile supplies the dev JWT secret and keeps the demo logins active.
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/open_credit
      DB_USER: postgres
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
